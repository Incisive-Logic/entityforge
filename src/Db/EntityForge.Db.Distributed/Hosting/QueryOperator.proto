syntax = "proto3";
package entityforge.partition.query;
option csharp_namespace = "EntityForge.Db.Distributed.Hosting.QueryWire";

// The small control envelope retains the existing JSON interpretation. Data
// pages have a distinct versioned contract; no JSON graph reconstruction occurs.
message Reply {
  uint32 format = 1;
  bytes control = 2;
  Page page = 3;
}
message Page {
  uint32 graph_presence = 1;
  repeated Vertex vertices = 2;
  repeated Edge edges = 3;
  repeated Edge adjacency = 4;
  repeated bytes bindings = 5;
  repeated Bag bags = 6;
  bytes profile_relation = 7;
  optional int32 next_offset = 8;
  bytes complete_result = 9;
  repeated Continuation continuations = 10;
}
message Vertex { bytes id = 1; repeated string labels = 2; repeated Property properties = 3; }
message Edge { bytes id = 1; bytes from = 2; bytes to = 3; string label = 4; repeated Property properties = 5; }
message Bag { bool edge = 1; bytes id = 2; repeated Property properties = 3; }
message Property { string name = 1; Value value = 2; }
message Value {
  oneof value {
    string text = 1;
    sint64 integer = 2;
    double real = 3;
    bool boolean = 4;
    string date = 5;
    string uri = 6;
    bytes binary = 7;
    string json = 8;
    ScalarArray array = 9;
    sint64 calendar_date = 10;
    CalendarDuration duration = 11;
    SpatialPoint point = 12;
    int64 local_time_nanoseconds = 13;
    LocalDateTime local_datetime = 14;
    ZonedTime zoned_time = 15;
    ZonedDateTime zoned_datetime = 16;
    bytes uuid = 17;
    string decimal_value = 18;
  }
}
message ZonedDateTime { int64 epoch_day = 1; int64 nanoseconds_of_day = 2; sint32 offset_seconds = 3; string zone_id = 4; }
message ZonedTime { int64 nanoseconds_of_day = 1; sint32 offset_seconds = 2; }
message ScalarArray { repeated Value values = 1; }
message CalendarDuration { sint64 months = 1; sint64 days = 2; sint64 seconds = 3; int32 nanoseconds = 4; uint32 qualifier = 5; }
message SpatialPoint { int32 srid = 1; double x = 2; double y = 3; optional double z = 4; }
message LocalDateTime { int64 epoch_day = 1; int64 nanoseconds_of_day = 2; }

// Root cohorts retain typed page bytes instead of JSON/base64 nesting.
message RootReply { uint32 format = 1; bytes control = 2; repeated RootPage pages = 3; }
message RootPage { bytes id = 1; Page page = 2; }

message Continuation { int32 stage = 1; repeated bytes identities = 2; repeated bytes dependencies = 3; Page page = 4; }
